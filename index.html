<!DOCTYPE html>
<html>
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>おく内科訪問患者マップ</title>
  <style>
    :root {
      --blue: #1a73e8; --red: #d93025; --green: #188038; --text: #202124; --sub: #5f6368;
      --line: #dadce0; --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
    }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--text); }
    button { font-family: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    svg { display: block; }
    #login { max-width: 360px; margin: 12vh auto 0; padding: 32px 24px; border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; }
    #login h1 { font-size: 22px; font-weight: 400; margin: 0 0 20px; text-align: center; }
    #login input { display: block; width: 100%; box-sizing: border-box; font-size: 16px; padding: 13px 14px; margin: 10px 0; border: 1px solid var(--line); border-radius: 4px; }
    #login input:focus { outline: 2px solid var(--blue); border-color: transparent; }
    #login button { width: 100%; font-size: 15px; padding: 12px; border: 0; border-radius: 4px; background: var(--blue); color: #fff; margin-top: 8px; }
    #loginMsg { color: var(--red); min-height: 1.5em; font-size: 14px; }
    #map { position: absolute; inset: 0; }
    #top { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 5; max-width: 420px; }
    #moved { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: block; padding: 10px 14px; background: #fef7e0; color: var(--text);
             font-size: 14px; line-height: 1.5; text-decoration: none; box-shadow: var(--shadow); }
    #moved b { color: var(--blue); font-weight: 500; }
    body.moved #top { top: 94px; }
    body.moved #login { margin-top: calc(12vh + 60px); }
    #searchBox { display: flex; align-items: center; height: 48px; background: #fff; border-radius: 24px; box-shadow: var(--shadow); padding: 0 4px 0 16px; }
    #searchBox .lead { color: var(--sub); flex: none; }
    #search { flex: 1; min-width: 0; border: 0; outline: 0; font-size: 16px; padding: 0 10px; background: transparent; }
    .round { flex: none; width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: var(--sub); display: flex; align-items: center; justify-content: center; }
    .round:active { background: #f1f3f4; }
    #suggest { margin-top: 4px; background: #fff; border-radius: 12px; box-shadow: var(--shadow); max-height: 50vh; overflow-y: auto; }
    .sug { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
    .sug:active, .sug:hover { background: #f8f9fa; }
    .sug .pin { flex: none; width: 32px; height: 32px; border-radius: 16px; background: #f1f3f4; display: flex; align-items: center; justify-content: center; color: var(--sub); }
    .sug .t { font-size: 15px; }
    .sug .s { font-size: 13px; color: var(--sub); }
    .sug.none { color: var(--sub); cursor: default; }
    #chips { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: #fff; box-shadow: var(--shadow); border: 0; font-size: 14px; color: var(--text); white-space: nowrap; }
    .chip.warn { background: #fce8e6; color: var(--red); }
    .chiprow { display: flex; gap: 8px; margin-top: 6px; overflow-x: auto; padding-bottom: 4px; }
    .chip.sel { background: #e8f0fe; color: #1967d2; box-shadow: var(--shadow), inset 0 0 0 1px #1967d2; }
    .chip.off { opacity: .45; }
    .chip .dot { width: 12px; height: 12px; border-radius: 6px; flex: none; }
    .chip .sq { border-radius: 2px; }
    .visit { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #f1f3f4; font-size: 15px; }
    .visit .dot { width: 12px; height: 12px; border-radius: 6px; flex: none; }
    .visit .sub { color: var(--sub); font-size: 13px; }
    #menu { position: absolute; top: 54px; right: 0; background: #fff; border-radius: 8px; box-shadow: var(--shadow); padding: 6px 0; min-width: 180px; }
    #menu button { display: flex; align-items: center; gap: 14px; width: 100%; font-size: 15px; padding: 12px 18px; border: 0; background: none; text-align: left; color: var(--text); }
    #menu button:active { background: #f1f3f4; }
    #fabs { position: absolute; right: 12px; bottom: 24px; z-index: 4; display: flex; flex-direction: column; gap: 12px; transition: bottom .2s; }
    .fab { width: 48px; height: 48px; border-radius: 24px; border: 0; background: #fff; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; color: var(--sub); }
    .fab.active { color: var(--blue); }
    #sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-radius: 16px 16px 0 0;
             box-shadow: 0 -2px 10px rgba(0,0,0,.2); max-height: 65vh; display: flex; flex-direction: column; }
    #sheet.collapsed #sheetBody { display: none; }
    #handle { padding: 8px 0 4px; touch-action: none; cursor: grab; }
    #handle::before { content: ""; display: block; width: 32px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
    #sheetHead { display: flex; align-items: flex-start; gap: 8px; padding: 4px 16px 10px; }
    #sheetTitle { flex: 1; min-width: 0; }
    #sheetTitle h2 { font-size: 22px; font-weight: 400; margin: 0; }
    #sheetTitle .s { color: var(--sub); font-size: 14px; margin-top: 2px; }
    #sheetBody { overflow-y: auto; padding: 0 16px 16px; }
    .close { background: #f1f3f4; }
    .actions { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
    .pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 500;
            border: 1px solid var(--line); background: #fff; color: var(--blue); text-decoration: none; }
    .pill.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .pill.danger { color: var(--red); }
    .pill.green { background: var(--green); border-color: var(--green); color: #fff; }
    .row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid #f1f3f4; color: var(--text); font-size: 15px; }
    .row .ic { color: var(--blue); flex: none; }
    .route-opts { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; padding: 4px 0 8px; font-size: 14px; color: var(--sub); }
    .route-opts input { font-size: 16px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
    .route-opts input[type=number] { width: 4em; }
    .stop { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-top: 1px solid #f1f3f4; }
    .stop .num { flex: none; width: 26px; height: 26px; border-radius: 13px; background: var(--red); color: #fff; text-align: center; line-height: 26px; font-weight: bold; font-size: 13px; }
    .stop .num.clinic { background: var(--green); }
    .stop .body { flex: 1; min-width: 0; }
    .stop .name { font-size: 15px; }
    .stop .time { color: var(--blue); font-weight: 500; margin-right: 6px; }
    .stop .sub { color: var(--sub); font-size: 13px; }
    .stop .mini { flex: none; width: 32px; height: 32px; border-radius: 16px; border: 0; background: transparent; color: var(--sub); display: flex; align-items: center; justify-content: center; }
    .stop .ctl { flex: none; display: flex; }
    .slot { position: relative; height: 0; z-index: 1; }
    .slot button { position: absolute; left: 50%; top: -13px; transform: translateX(-50%); width: 26px; height: 26px; border-radius: 13px; padding: 0;
                   border: 1px solid var(--line); background: #fff; color: var(--sub); display: flex; align-items: center; justify-content: center; }
    .slot button.on { color: var(--blue); border-color: var(--blue); }
    .slot button svg { width: 18px; height: 18px; }
    .stop .mini:disabled { opacity: .3; }
    .stop a.mini { color: var(--blue); text-decoration: none; }
    #routeSummary { font-size: 15px; padding: 10px 0 4px; }
    #routeSummary b { color: var(--green); font-size: 18px; font-weight: 500; }
    #routeMsg { color: var(--red); font-size: 14px; }
    .note { color: var(--sub); font-size: 12px; margin-top: 6px; }
    #routeAdd { margin: 16px 0 6px 38px; padding: 8px 10px; border-radius: 8px; background: #f8f9fa; }
    #routeAdd .head { display: flex; align-items: center; justify-content: space-between; margin: -4px 0 6px; }
    #routeAdd h3 { font-size: 14px; font-weight: 500; margin: 0; color: var(--sub); }
    #routeAddCancel { border: 0; background: none; color: var(--blue); font-size: 14px; font-weight: 500; padding: 6px 4px; }
    #routeAddQ { width: 100%; box-sizing: border-box; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .cand { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
    .cand:active { background: #f8f9fa; }
    .cand .dot { width: 12px; height: 12px; border-radius: 6px; flex: none; background: #9aa0a6; }
    .cand .body { flex: 1; min-width: 0; }
    .cand .t { font-size: 15px; }
    .cand .s { font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cand .plus { flex: none; color: var(--blue); display: flex; }
    #toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 20; background: #323232; color: #fff;
             padding: 12px 18px; border-radius: 6px; font-size: 14px; max-width: 86vw; box-shadow: var(--shadow); }
    @media (min-width: 800px) {
      #top { max-width: 392px; }
      #sheet { left: 10px; right: auto; width: 392px; bottom: 10px; border-radius: 12px; max-height: calc(100vh - 140px); }
      #fabs { bottom: 110px; }
      #toast { bottom: 30px; }
    }
  </style>
</head>
<body>

  <form id="login" class="hidden">

    <div id="toast" class="hidden"></div>
  </div>
  <script>

function icon(name, size) {
    size = size || 20;
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("fill", "currentColor");
    var path = document.createElementNS(ns, "path");
    path.setAttribute("d", ICONS[name]);
    svg.appendChild(path);
    return svg;
}
Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"), function(el) {
    el.insertBefore(icon(el.getAttribute("data-icon"), el.classList.contains("fab") ? 24 : 20), el.firstChild);
});
function $(id) {
    return document.getElementById(id);
}
var API_URL = "https://script.google.com/macros/s/AKfycbzFBDYgC_OaMd1Rd6FtMjNKpkXo_dwQynrGM4BEv2hP_yrWHCchyMn7jI_lIfCLsmo8RA/exec";
var API_FUNCTIONS = [ "login", "logout", "getMapData", "refreshMap", "computeRoute" ];
if (window.google && google.script && google.script.run) {
    $("moved").classList.remove("hidden");
    document.body.classList.add("moved");
}
function server() {
    if (window.google && google.script && google.script.run) return google.script.run;
    var ok = function() {}, ng = function() {};
    var runner = {
        withSuccessHandler: function(f) {
            ok = f;
            return runner;
        },
        withFailureHandler: function(f) {
            ng = f;
            return runner;
        }
    };
    API_FUNCTIONS.forEach(function(fn) {
        runner[fn] = function() {
            var args = Array.prototype.slice.call(arguments);
            var send = function(retry) {
                fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        action: "api",
                        fn: fn,
                        args: args
                    }),
                    credentials: "omit"
                }).then(function(r) {
                    return r.text();
                }).then(function(text) {
                    var res;
                    try {
                        res = JSON.parse(text);
                    } catch (e) {
                        if (retry) {
                            setTimeout(function() {
                                send(false);
                            }, 2e3);
                            return;
                        }
                        throw new Error("サーバーの応答を読めませんでした");
                    }
                    if (res && res.apiError) throw new Error(res.apiError);
                    ok(res);
                }).catch(function(e) {
                    ng(e instanceof Error ? e : new Error(String(e)));
                });
            };
            send(fn !== "refreshMap");
        };
    });
    return runner;
}
window.addEventListener("error", function(e) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = "画面のエラー: " + e.message + "（" + e.lineno + "行）";
    t.classList.remove("hidden");
});
var TOKEN_KEY = "visitMapToken";
var memoryToken = null;
function getToken() {
    try {
        return localStorage.getItem(TOKEN_KEY) || memoryToken;
    } catch (e) {
        return memoryToken;
    }
}
function setToken(t) {
    memoryToken = t;
    try {
        localStorage.setItem(TOKEN_KEY, t);
    } catch (e) {}
}
function clearToken() {
    memoryToken = null;
    try {
        localStorage.removeItem(TOKEN_KEY);
    } catch (e) {}
}
function showLogin(message) {
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("loginMsg").textContent = message || "";
}
function expired() {
    clearToken();
    showLogin("ログインの有効期限が切れました");
}
function loadData() {
    var token = getToken();
    if (!token) {
        showLogin();
        return;
    }
    server().withSuccessHandler(function(data) {
        if (!data.ok) {
            expired();
            return;
        }
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        startMap(data);
    }).withFailureHandler(function(e) {
        showLogin("読み込みに失敗しました: " + e.message);
    }).getMapData(token);
}
$("login").addEventListener("submit", function(ev) {
    ev.preventDefault();
    $("loginMsg").textContent = "確認中…";
    server().withSuccessHandler(function(res) {
        if (!res.ok) {
            $("loginMsg").textContent = res.message;
            return;
        }
        setToken(res.token);
        $("loginPw").value = "";
        loadData();

    }).login($("loginId").value, $("loginPw").value);
});
$("logout").addEventListener("click", function() {

    clearToken();
    server().withSuccessHandler(function() {
        location.reload();
    }).logout(token);
});

var DEPART_AM = "09:15";

function routeFromView() {
    var day = currentDay();
    if (!day) return;
    var list = day.visits.filter(function(v) {
        return v.patient !== null && visitShown(v);
    }).sort(function(a, b) {
        return (a.start || 0) - (b.start || 0);
    });
    var seen = {};
    var stops = [];
    list.forEach(function(v) {
        if (!seen[v.patient]) {
            seen[v.patient] = true;
            stops.push(patients[v.patient]);
        }
    });
    if (!stops.length) {
        toast("表示中の訪問がありません");
        return;
    }
    if (stops.length > 25) {
        toast("ルートに入れられるのは25件までです。医師や午前・午後で絞り込んでください", 5e3);
        return;
    }
    routeStops = stops;
    routeDate = day.date;
    $("routeStart").value = list[0].half === "pm" ? DEPART_PM : DEPART_AM;
    selected = null;
    missingOpen = false;
    routeChanged();
    $("sheet").classList.remove("collapsed");
    showSheet();
    calcRoute(false);
}

function toKatakana(q) {
    var s = String(q).normalize("NFKC").replace(/[\s　]+/g, "").replace(/[ぁ-ゖ]/g, function(c) {
        return String.fromCharCode(c.charCodeAt(0) + 96);
    });
    return /^[ァ-ヶー]+$/.test(s) ? s : "";
}
function hideSuggest() {

function renderSuggest() {
    var q = $("search").value.trim().replace(/\s+/g, "");
    $("searchClear").classList.toggle("hidden", !$("search").value);
    var box = $("suggest");
    box.innerHTML = "";
    if (!q) {
        hideSuggest();
        return;
    }
    var qk = toKatakana(q);
    var hits = patients.filter(function(p) {
        return p.name.replace(/\s+/g, "").indexOf(q) >= 0 || p.address.replace(/\s+/g, "").indexOf(q) >= 0 || p.kana && qk && p.kana.indexOf(qk) >= 0;
    }).slice(0, 20);
    if (!hits.length) {
        var none = document.createElement("div");
        none.className = "sug none";
        none.textContent = "見つかりません";
        box.appendChild(none);
    }
    hits.forEach(function(p) {
        var row = document.createElement("div");
        row.className = "sug";
        var pin = document.createElement("div");
        pin.className = "pin";
        pin.appendChild(icon("pin", 18));
        var text = document.createElement("div");
        var t = document.createElement("div");
        t.className = "t";
        t.textContent = p.name;
        var s = document.createElement("div");
        s.className = "s";
        s.textContent = p.address;
        text.appendChild(t);
        text.appendChild(s);
        row.appendChild(pin);
        row.appendChild(text);
        row.addEventListener("click", function() {
            $("search").value = p.name;
            $("search").blur();
            openPlace(p);
        });
        box.appendChild(row);
    });
    box.classList.remove("hidden");
}

    }
});
$("searchClear").addEventListener("click", function() {
    $("search").value = "";
    renderSuggest();
    $("search").focus();
});
$("menuBtn").addEventListener("click", function(ev) {
    ev.stopPropagation();
    hideSuggest();
    $("menu").classList.toggle("hidden");
});
document.addEventListener("click", function(e) {
    if (!e.target.closest("#menu")) $("menu").classList.add("hidden");
});
$("refresh").addEventListener("click", function() {
    $("menu").classList.add("hidden");
    toast("住所から位置を取り直しています…（1分ほどかかることがあります）", 6e4);
    server().withSuccessHandler(function(data) {
        if (data.ok) {
            window.__mapData = data;
            drawPatients(data, false);
            toast("地図を更新しました");
            return;
        }
        if (data.busy) {
            toast(data.message);
            return;
        }
        expired();
    }).withFailureHandler(function(e) {
        toast("更新に失敗しました: " + e.message, 6e3);
    }).refreshMap(getToken());
});
function setFollowing(on) {
    following = on;
    $("locate").classList.toggle("active", on);
}
function showHere(pos) {
    here = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
    };
    if (!hereDot) {
        hereCircle = new google.maps.Circle({
            map: map,
            center: here,
            radius: pos.coords.accuracy,
            strokeWeight: 0,
            fillColor: "#1a73e8",
            fillOpacity: .15,
            clickable: false
        });
        hereDot = new google.maps.Marker({
            map: map,
            position: here,
            zIndex: 2e3,
            title: "現在地",
            clickable: false,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 8,
                fillColor: "#1a73e8",
                fillOpacity: 1,
                strokeColor: "#fff",
                strokeWeight: 3
            }
        });
    } else {
        hereDot.setPosition(here);
        hereCircle.setCenter(here);
        hereCircle.setRadius(pos.coords.accuracy);
    }
    if (following) map.panTo(here);
    updateDistance();
}
function geoError(err) {
    setFollowing(false);
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
    if (err.code === 1) {
        toast("位置情報の利用が許可されていません。端末やブラウザの設定で、このページの位置情報を許可してください", 7e3);
    } else {
        toast("現在地を取得できませんでした（" + err.message + "）", 5e3);
    }
}
$("locate").addEventListener("click", function() {
    if (!navigator.geolocation) {
        toast("この端末では現在地を取得できません");
        return;
    }
    setFollowing(true);
    if (here) {
        map.panTo(here);
        if (map.getZoom() < 15) map.setZoom(16);
    } else {
        toast("現在地を取得しています…", 2e3);
    }
    if (watchId === null) {
        var first = true;
        watchId = navigator.geolocation.watchPosition(function(pos) {
            showHere(pos);
            if (first) {
                first = false;
                map.panTo(here);
                map.setZoom(16);
            }
        }, geoError, {
            enableHighAccuracy: true,
            timeout: 15e3,
            maximumAge: 1e4
        });
    }
});
function routeIndex(p) {
    if (!p) return -1;
    for (var i = 0; i < routeStops.length; i++) if (sameStop(routeStops[i], p)) return i;
    return -1;
}
function routeChanged() {
    routeResult = null;
    if (!routeStops.length) {
        autoCalc = false;
        clearTimeout(recalcTimer);
        recalcTimer = null;
    }
    renderRoute();
}
var autoCalc = false;
var recalcTimer = null;
var RECALC_DELAY_MS = 1e3;
function editRoute() {
    routeChanged();
    if (!autoCalc || !routeStops.length) return;
    clearTimeout(recalcTimer);
    recalcTimer = setTimeout(function() {
        recalcTimer = null;
        calcRoute(false, true);
    }, RECALC_DELAY_MS);
}
function fmtTime(ms) {
    var d = new Date(ms);
    return d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
}
function fmtMin(sec) {
    var m = Math.round(sec / 60);
    return m >= 60 ? Math.floor(m / 60) + "時間" + m % 60 + "分" : m + "分";
}
function departureMs() {
    var v = $("routeStart").value || "09:00";
    var d = new Date;
    if (routeDate) {
        var p = routeDate.split("-");
        d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }
    d.setHours(Number(v.split(":")[0]), Number(v.split(":")[1]), 0, 0);
    return d.getTime();
}
function miniButton(iconName, label, onClick, disabled) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "mini";
    b.setAttribute("aria-label", label);
    b.title = label;
    b.disabled = !!disabled;
    b.appendChild(icon(iconName));
    b.addEventListener("click", function(e) {
        e.stopPropagation();
        onClick();
    });
    return b;
}
function stopRow(numText, isClinic, name, timeText, subText, target, controls) {
    var row = document.createElement("div");
    row.className = "stop";
    var num = document.createElement("div");
    num.className = "num" + (isClinic ? " clinic" : "");
    num.textContent = numText;
    row.appendChild(num);
    var body = document.createElement("div");
    body.className = "body";
    var t = document.createElement("div");
    t.className = "name";
    if (timeText) {
        var tm = document.createElement("span");
        tm.className = "time";
        tm.textContent = timeText;
        t.appendChild(tm);
    }
    t.appendChild(document.createTextNode(name));
    body.appendChild(t);
    if (subText) {
        var sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = subText;
        body.appendChild(sub);
    }
    row.appendChild(body);
    var ctl = document.createElement("div");
    ctl.className = "ctl";
    row.appendChild(ctl);
    (controls || []).forEach(function(c) {
        ctl.appendChild(c);
    });
    if (target) {
        var a = document.createElement("a");
        a.className = "mini";
        a.href = navUrl(target);
        a.title = "経路";
        a.appendChild(icon("directions"));
        ctl.appendChild(a);
    }
    return row;
}
var PREP_SEC = 5 * 60;
function renderRoute() {
    patients.forEach(function(p) {
        if (p.marker) p.marker.setLabel(null);
    });
    routeStops.forEach(function(p, i) {
        if (p.marker) p.marker.setLabel({
            text: String(i + 1),
            color: "#fff",
            fontWeight: "bold"
        });
    });
    if (routeLine) {
        routeLine.setMap(null);
        routeLine = null;
    }
    $("routeChip").classList.toggle("hidden", routeStops.length === 0);
    $("routeChipText").textContent = "ルート " + routeStops.length + "件";
    $("routeMsg").textContent = "";
    var typingAdd = document.activeElement === $("routeAddQ");
    var list = $("routeList");
    $("route").appendChild($("routeAdd"));
    list.innerHTML = "";
    var r = routeResult;
    var t = r ? r.departureMs : null;
    var stay = Math.max(Number($("routeStay").value) || 0, 0) * 60 * 1e3;
    var totalSec = 0, totalM = 0;
    list.appendChild(stopRow("院", true, "クリニック出発", r ? fmtTime(t) : "", "", null));
    list.appendChild(addSlot(0));
    if (addAt === 0) list.appendChild(addPanel());
    routeStops.forEach(function(p, i) {
        var timeText = "", subText = p.address;
        if (r) {
            var leg = r.legs[i];
            var sec = leg.seconds + PREP_SEC;
            totalSec += sec;
            totalM += leg.meters;
            t += sec * 1e3;
            timeText = fmtTime(t) + "着";
            subText = "移動 " + fmtMin(sec) + "・" + (leg.meters / 1e3).toFixed(1) + " km　" + fmtTime(t + stay) + " 発";
            t += stay;
        }
        list.appendChild(stopRow(String(i + 1), false, p.name, timeText, subText, p, [ miniButton("up", "上へ", function() {
            moveStop(i, -1);
        }, i === 0), miniButton("down", "下へ", function() {
            moveStop(i, 1);
        }, i === routeStops.length - 1), miniButton("close", "外す", function() {
            routeStops.splice(i, 1);
            addAt = null;
            editRoute();
        }) ]));
        list.appendChild(addSlot(i + 1));
        if (addAt === i + 1) list.appendChild(addPanel());
    });
    var summary = $("routeSummary");
    summary.innerHTML = "";
    if (r) {
        var last = r.legs[r.legs.length - 1];
        var lastSec = last.seconds + PREP_SEC;
        totalSec += lastSec;
        totalM += last.meters;
        t += lastSec * 1e3;
        list.appendChild(stopRow("院", true, "クリニック帰着", fmtTime(t) + "着", "移動 " + fmtMin(lastSec) + "・" + (last.meters / 1e3).toFixed(1) + " km", clinic));
        var depDate = new Date(r.departureMs);
        var depStr = depDate.getFullYear() + "-" + ("0" + (depDate.getMonth() + 1)).slice(-2) + "-" + ("0" + depDate.getDate()).slice(-2);
        var dayText = depStr !== todayStr() ? "（" + dayLabel(depStr) + "）" : "";
        var b = document.createElement("b");
        b.textContent = fmtTime(r.departureMs) + dayText + " → " + fmtTime(t);
        summary.appendChild(b);
        summary.appendChild(document.createTextNode("　移動 計" + fmtMin(totalSec) + "（" + (totalM / 1e3).toFixed(1) + " km）"));
        var prepNote = document.createElement("div");
        prepNote.className = "note";
        prepNote.textContent = "移動時間はGoogleの予測に準備時間" + PREP_SEC / 60 + "分を足しています";
        summary.appendChild(prepNote);
        if (r.trafficShifted) {
            var note = document.createElement("div");
            note.className = "note";
            note.textContent = "過ぎた時刻のため、同じ曜日・時刻の渋滞予測で計算しています";
            summary.appendChild(note);
        }
        if (r.polyline && google.maps.geometry) {
            routeLine = new google.maps.Polyline({
                path: google.maps.geometry.encoding.decodePath(r.polyline),
                map: map,
                strokeColor: "#1a73e8",
                strokeOpacity: .9,
                strokeWeight: 6
            });
        }
    } else {
        list.appendChild(stopRow("院", true, "クリニック帰着", "", "", null));
    }
    if (addAt === null || addAt > routeStops.length) {
        addAt = null;
        $("routeAdd").classList.add("hidden");
    }
    if (typingAdd && addAt !== null) $("routeAddQ").focus();
    renderOpenLinks();
    renderAddList();
    showSheet();
}
function routeDay() {
    return schedules.filter(function(d) {
        return d.date === (routeDate || viewDate);
    })[0] || null;
}
function firstVisit(p, date) {
    var vs = (p.visits && p.visits[date] || []).slice().sort(function(a, b) {
        return (a.start || 0) - (b.start || 0);
    });
    return vs[0] || null;
}
var addAt = null;
function addSlot(at) {
    var slot = document.createElement("div");
    slot.className = "slot";
    var b = document.createElement("button");
    b.type = "button";
    b.className = addAt === at ? "on" : "";
    b.setAttribute("aria-label", "ここに患者を追加");
    b.title = "ここに患者を追加";
    b.appendChild(icon("add"));
    b.addEventListener("click", function(e) {
        e.stopPropagation();
        addAt = addAt === at ? null : at;
        $("routeAddQ").value = "";
        renderRoute();
        if (addAt !== null) {
            $("sheet").classList.remove("collapsed");
            $("routeAddQ").focus();
            $("routeAdd").scrollIntoView({
                block: "nearest"
            });
        }
    });
    slot.appendChild(b);
    return slot;
}
function addPanel() {
    var el = $("routeAdd");
    el.classList.remove("hidden");
    $("routeAddTitle").textContent = (addAt === 0 ? "クリニックの次" : addAt + " 番目の次") + "に追加";
    return el;
}
function renderAddList() {
    var box = $("routeAddList");
    box.innerHTML = "";
    var q = $("routeAddQ").value.trim().replace(/\s+/g, "");
    var qk = toKatakana(q);
    var day = routeDay();
    var cands;
    if (q) {
        cands = patients.filter(function(p) {
            return routeIndex(p) < 0 && (p.name.replace(/\s+/g, "").indexOf(q) >= 0 || p.kana && qk && p.kana.indexOf(qk) >= 0);
        }).slice(0, 20);
    } else {
        cands = [];
    }
    cands.forEach(function(p) {
        var v = day ? firstVisit(p, day.date) : null;
        var row = document.createElement("div");
        row.className = "cand";
        var dot = document.createElement("span");
        dot.className = "dot";
        if (v) {
            dot.style.background = doctorColors[v.doctor] || "#9aa0a6";
            if (v.half === "pm") dot.style.borderRadius = "2px";
        }
        var body = document.createElement("div");
        body.className = "body";
        var t = document.createElement("div");
        t.className = "t";
        t.textContent = (v ? v.timeRange + "　" : "") + p.name;
        var sub = document.createElement("div");
        sub.className = "s";
        sub.textContent = v ? shortDoctor(v.doctor) + "　" + p.address : p.address;
        body.appendChild(t);
        body.appendChild(sub);
        var plus = document.createElement("span");
        plus.className = "plus";
        plus.appendChild(icon("add"));
        row.appendChild(dot);
        row.appendChild(body);
        row.appendChild(plus);
        row.addEventListener("click", function() {
            addToRoute(p, addAt);
        });
        box.appendChild(row);
    });
    if (q && !cands.length) {
        var none = document.createElement("div");
        none.className = "note";
        none.textContent = "見つかりません";
        box.appendChild(none);
    }
}
function addToRoute(p, at) {
    if (routeIndex(p) >= 0) return;
    if (routeStops.length >= 25) {
        toast("ルートに入れられるのは25件までです");
        return;
    }
    addAt = null;
    var v = routeDate ? firstVisit(p, routeDate) : null;
    if (at === null || at === undefined) at = routeStops.length; else v = null;
    if (v && v.start !== null) {
        for (var i = 0; i < routeStops.length; i++) {
            var w = firstVisit(routeStops[i], routeDate);
            if (w && w.start !== null && w.start > v.start) {
                at = i;
                break;
            }
        }
    }
    routeStops.splice(at, 0, p);
    $("routeAddQ").value = "";
    toast(p.name + " を " + (at + 1) + " 番目に追加しました");
    editRoute();
}
$("routeAddQ").addEventListener("input", renderAddList);
$("routeAddCancel").addEventListener("click", function() {
    addAt = null;
    $("routeAddQ").value = "";
    $("routeAddQ").blur();
    renderRoute();
});
function moveStop(i, d) {
    var p = routeStops.splice(i, 1)[0];
    routeStops.splice(i + d, 0, p);
    editRoute();
}
var STOPS_PER_LINK = 10;
function renderOpenLinks() {
    var box = $("routeOpen");
    box.innerHTML = "";
    var points = routeStops.map(function(p, i) {
        return {
            q: p.approx || !p.navAddress ? p.lat + "," + p.lng : p.navAddress,
            label: String(i + 1)
        };
    });
    if (clinic) points.push({
        q: clinic.address || clinic.lat + "," + clinic.lng,
        label: "院"
    });
    for (var start = 0; start < points.length; start += STOPS_PER_LINK) {
        var chunk = points.slice(start, start + STOPS_PER_LINK);
        var dest = chunk[chunk.length - 1];
        var via = chunk.slice(0, -1);
        var url = "https://www.google.com/maps/dir/?api=1&travelmode=driving" + "&destination=" + encodeURIComponent(dest.q);
        if (via.length) {
            url += "&waypoints=" + encodeURIComponent(via.map(function(w) {
                return w.q.replace(/\|/g, " ");
            }).join("|"));
        }
        var a = document.createElement("a");
        a.className = "pill green";
        a.href = url;
        a.appendChild(icon("open", 18));
        a.appendChild(document.createTextNode(points.length <= STOPS_PER_LINK ? "Googleマップでまとめて開く" : "Googleマップで開く（" + (via.length ? chunk[0].label : "") + "→" + dest.label + "）"));
        box.appendChild(a);
    }
}
function safePadding() {
    var w = $("map").offsetWidth, h = $("map").offsetHeight;
    if (isWide()) return {
        left: Math.min(420, w * .5),
        top: 80,
        right: 40,
        bottom: 40
    };
    var top = Math.min($("top").offsetHeight + 20, h * .3);
    var bottom = Math.min($("sheet").classList.contains("hidden") ? 20 : $("sheet").offsetHeight + 20, h * .4);
    return {
        top: top,
        bottom: bottom,
        left: 30,
        right: 30
    };
}
var routeCache = {};
var routeSeq = 0;
function calcRoute(optimize, keepView) {
    clearTimeout(recalcTimer);
    recalcTimer = null;
    if (!routeStops.length) return;
    autoCalc = true;
    $("routeMsg").textContent = "";
    var stops = routeStops.map(function(p) {
        return {
            lat: p.lat,
            lng: p.lng
        };
    });
    var dep = departureMs();
    var key = [ dep, optimize ? 1 : 0 ].concat(stops.map(function(st) {
        return st.lat + "," + st.lng;
    })).join("|");
    var seq = ++routeSeq;
    var onResult = function(res) {
        try {
            showRouteResult(res);
        } catch (e) {
            $("routeMsg").textContent = "ルートの表示に失敗しました: " + e.message;
            $("toast").classList.add("hidden");
        }
    };
    var showRouteResult = function(res) {
        if (seq !== routeSeq) return;
        $("toast").classList.add("hidden");
        if (res.expired) {
            expired();
            return;
        }
        if (!res.ok) {
            $("routeMsg").textContent = res.message;
            return;
        }
        routeCache[key] = res;
        if (optimize) routeStops = res.order.map(function(k) {
            return routeStops[k];
        });
        routeResult = res;
        renderRoute();
        if (routeLine && !keepView) {
            var bounds = new google.maps.LatLngBounds;
            routeLine.getPath().forEach(function(ll) {
                bounds.extend(ll);
            });
            map.fitBounds(bounds, safePadding());
        }
    };
    if (routeCache[key]) {
        onResult(routeCache[key]);
        return;
    }
    toast("ルートを計算中…", 2e4);
    server().withSuccessHandler(onResult).withFailureHandler(function(e) {
        if (seq !== routeSeq) return;
        $("toast").classList.add("hidden");
        $("routeMsg").textContent = "計算に失敗しました: " + e.message;
    }).computeRoute(getToken(), stops, dep, optimize);
}
$("routeCalc").addEventListener("click", function() {
    calcRoute(false);
});
$("routeOptimize").addEventListener("click", function() {
    calcRoute(true);
});
$("routeClear").addEventListener("click", function() {
    routeStops = [];
    routeDate = null;
    routeChanged();
});
$("routeStart").addEventListener("change", editRoute);
$("routeStay").addEventListener("change", renderRoute);
$("routeChip").addEventListener("click", function() {
    selected = null;
    missingOpen = false;
    $("sheet").classList.remove("collapsed");
    showSheet();
});
loadData();
</script>
